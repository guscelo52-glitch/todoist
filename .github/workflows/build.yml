name: Gerar APK e site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - run: npx cap add android && npx cap sync android
      - name: Ícone e permissão de alarme exato
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*dpi; do
            cp android-icons/icon.png $d/ic_launcher.png
            cp android-icons/icon.png $d/ic_launcher_round.png
          done
          sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pauta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  site:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
